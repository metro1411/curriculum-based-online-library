services:
  - type: web
    name: smart-dit-learning-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: resources
      - key: INITIAL_STUDENT_PASSWORD
        sync: false
      - key: INITIAL_LECTURER_PASSWORD
        sync: false
      - key: HOD_ACTIVATION_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLE_WEB_GROUNDING
        value: "1"
