<div class="modal-backdrop" data-confirm-modal>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h3 id="confirm-title" data-confirm-title>Are you sure?</h3>
    <p data-confirm-body class="mb-0">This action cannot be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-confirm-cancel>Cancel</button>
      <button type="button" class="btn btn-danger" data-confirm-accept>Yes, continue</button>
    </div>
  </div>
</div>
